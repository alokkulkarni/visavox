[project]
name = "s3-livekit-contract"
version = "0.1.0"
description = "Spike S3: throwaway avatar worker proving the LiveKit avatar contract (RT-06, LK-01, LK-02, LK-04)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "livekit-agents>=1.8,<1.9",
    "livekit-api>=1.2,<2",
    "numpy>=2.0",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/s3_livekit_contract"]
