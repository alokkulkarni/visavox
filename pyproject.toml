[project]
name = "visavox-workspace"
version = "0.0.0"
description = "Visavox monorepo workspace root (not a distributable package)"
requires-python = ">=3.12,<3.13"

[tool.uv]
package = false
# Supply-chain cooldown: ignore package versions published in the last 7 days (NFR-S3).
exclude-newer = "7 days"

[tool.uv.workspace]
members = ["tools/*", "spikes/*"]

[tool.uv.sources]
licence-gate = { workspace = true }
local-cell = { workspace = true }
s3-livekit-contract = { workspace = true }

[dependency-groups]
dev = [
    "licence-gate",
    "local-cell",
    "s3-livekit-contract",
    "pytest-asyncio>=1.0",
    "pytest-timeout>=2.3",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-PyYAML>=6.0",
    # Local cell smoke tests (NFR-O5): AWS stand-ins and PostgreSQL.
    "asyncpg>=0.30",
    "boto3>=1.35",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --import-mode=importlib"
testpaths = ["tools", "spikes", "services", "tests"]
asyncio_mode = "auto"
# Fail hung tests with their stack instead of blocking CI (S3 found an intermittent hang).
timeout = 120
asyncio_default_fixture_loop_scope = "function"
markers = [
    "contract: API, LiveKit avatar contract and Connect event contract tests",
    "media: audio/video quality harness tests (GPU)",
    "e2e: end-to-end tests against deployed environments",
    "load: load and capacity tests",
    "local: smoke tests against the running local Docker cell (make up)",
]

[tool.coverage.run]
branch = true
source = ["tools", "spikes"]
# Measure production code only: test modules are ~100 % covered and would inflate the gate (rule 12).
omit = ["*/tests/*"]

[tool.coverage.report]
fail_under = 90
show_missing = true
exclude_also = ["if __name__ == .__main__.:"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["licence_gate", "local_cell", "s3_livekit_contract"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S105", "S106"]  # asserts and test-only credentials

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
