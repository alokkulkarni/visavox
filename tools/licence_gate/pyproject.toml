[project]
name = "licence-gate"
version = "0.1.0"
description = "Validates models/registry.yaml against Visavox licence rules (ADR-005, NFR-S6)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.9",
    "PyYAML>=6.0",
]

[project.scripts]
licence-gate = "licence_gate.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/licence_gate"]
