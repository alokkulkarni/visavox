# CI gates required by CLAUDE.md (rules 10-12, 19-24) and SDD §14. Merges need every job green.
# Actions are pinned to full commit SHAs (version in the comment); Dependabot proposes updates.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: lint · types · tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"
      - run: uv sync --all-packages --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy tools/licence_gate/src spikes/s3_livekit_contract/src
      - run: make test

  licence-gate:
    name: model licence gate (NFR-S6)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"
      - run: uv sync --all-packages --locked
      - run: make licence-check

  security:
    name: SAST · secrets · vulnerabilities · SBOM (NFR-S3)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Semgrep SAST (findings become annotations; fails closed)
        run: |
          pipx run semgrep scan --config p/default --metrics=off --json --output semgrep.json || true
          python3 - <<'PY'
          import json, sys
          data = json.load(open("semgrep.json"))
          for r in data.get("results", []):
              msg = r["extra"]["message"].replace("\n", " ")[:300]
              print(f"::error file={r['path']},line={r['start']['line']},title={r['check_id']}::{msg}")
          for e in data.get("errors", []):
              print(f"::warning title=semgrep-error::{str(e)[:300]}")
          print(f"semgrep: {len(data.get('results', []))} finding(s)")
          sys.exit(1 if data.get("results") else 0)
          PY
      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Trivy filesystem scan (high and critical block)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: SBOM (SPDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          artifact-name: sbom.spdx.json

  contract:
    name: contract · LiveKit avatar (RT-06, LK-01, LK-04)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"
      - name: Start self-hosted LiveKit server (dev mode)
        run: |
          docker run -d --name livekit --network host livekit/livekit-server:v1.13.10 --dev --bind 0.0.0.0
          for i in $(seq 1 60); do curl -sf http://localhost:7880 >/dev/null && break; sleep 1; done
          curl -sf http://localhost:7880 && echo " LiveKit up"
          docker logs livekit 2>&1 | tail -5
      - run: uv sync --all-packages --locked
      - name: Unit and contract tests with coverage
        env:
          LIVEKIT_URL: ws://localhost:7880
          S3_RESULTS_PATH: s3-results.jsonl
        run: make test-contract
      - name: Publish S3 measurements as annotations
        if: always()
        run: |
          if [ -f s3-results.jsonl ]; then
            while read -r line; do echo "::notice title=S3 measurement::$line"; done < s3-results.jsonl
          fi
      - name: LiveKit server log tail
        if: failure()
        run: docker logs livekit 2>&1 | tail -40
